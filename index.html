<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>인프라 학습 지도</title>
  <style>
    /* 메인 화면(전체 지도) — 외부 글꼴·CDN 없이 이 파일 하나로 동작합니다. */
    :root {
      --h: 226;
      --lav: hsl(var(--h) 95% 85%);
      --text: #ecebf1; --muted: #84838c; --soft: #c9c7d3;
      --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .18);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh; background: #000; color: var(--text); overflow-x: hidden;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      word-break: keep-all; overflow-wrap: break-word;
    }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .glow { position: fixed; left: 50%; top: 58%; width: 90vw; height: 70vh; transform: translate(-50%, -50%); pointer-events: none; background: radial-gradient(closest-side, hsl(var(--h) 60% 45% / .22), transparent 75%); transition: background .6s var(--ease); animation: breathe 9s var(--ease) infinite alternate; }
    @keyframes breathe { from { opacity: .6; } to { opacity: 1; } }
    .wrap { position: relative; max-width: 1280px; margin: 0 auto; padding: 32px 24px 48px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

    /* 입체 지도: 01 → 06 을 왼쪽에서 오른쪽으로(좁은 화면은 위에서 아래로) */
    .map { position: relative; margin-top: 48px; }
    .map:focus { outline: none; }
    .map svg { display: block; width: 100%; height: auto; overflow: visible; }
    .ft, .fa, .fb { stroke-width: 1.2; stroke-linejoin: round; transition: fill .3s, stroke .3s; }
    .ft { fill: #121214; stroke: rgba(255, 255, 255, .62); }
    .fa { fill: #0a0a0b; stroke: rgba(255, 255, 255, .5); }
    .fb { fill: #070708; stroke: rgba(255, 255, 255, .5); }
    .shadow { fill: rgba(255, 255, 255, .025); stroke: rgba(255, 255, 255, .14); stroke-width: 1; }
    .drop { stroke: rgba(255, 255, 255, .28); stroke-width: 1; stroke-dasharray: 3 5; }
    .sym { fill: none; stroke: hsl(var(--h) 85% 72%); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s; }
    .sym .dotf { fill: hsl(var(--h) 85% 72%); stroke: none; }
    .tile { cursor: pointer; outline: none; }
    .tile .lift { transition: transform .45s var(--ease), filter .45s var(--ease); }
    .tile.is-on .lift { transform: translateY(-12px); filter: drop-shadow(0 0 16px hsl(var(--h) 90% 65% / .55)); }
    .tile.is-on .ft { fill: hsl(var(--h) 40% 15%); stroke: hsl(var(--h) 95% 88%); }
    .tile.is-on .sym { stroke: hsl(var(--h) 95% 86%); }
    .tile:focus-visible .ft { stroke: #fff; stroke-width: 2.4; }
    .map.has-on .tile:not(.is-on) { opacity: .4; }
    .tile { transition: opacity .35s; }
    .lbl-en { fill: #8e8d95; font: 800 26px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; letter-spacing: .14em; transition: fill .3s; }
    .lbl-ko { fill: #8e8d95; font-size: 16px; transition: fill .3s; }
    .lbl-no { fill: hsl(var(--h) 85% 72%); font: 700 13px var(--mono); letter-spacing: .2em; }
    .lbl-start { fill: hsl(var(--h) 95% 82%); font-size: 13px; font-weight: 600; }
    .lbl-line { stroke: rgba(255, 255, 255, .35); stroke-width: 1; fill: none; }
    .tile.is-on .lbl-en { fill: #fff; }
    .tile.is-on .lbl-ko { fill: var(--soft); }
    .track { fill: none; stroke: rgba(255, 255, 255, .2); stroke-width: 1.4; stroke-dasharray: 4 7; }
    .hint { margin: 4px 0 0; min-height: 1.6em; text-align: center; color: var(--muted); font-size: 15px; }
    .hint b { color: var(--text); font-weight: 600; }

    body { animation: pageIn .5s var(--ease) both; }
    @keyframes pageIn { from { opacity: 0; } }
    html.is-leaving body { opacity: 0; transition: opacity .3s ease .05s; }
    html.is-leaving .map svg { transform: scale(1.08); transition: transform .35s var(--ease); }
    html.is-leaving .tile.is-on .lift { transform: translateY(-28px); }
    @media (max-width: 720px) {
      .wrap { padding: 24px 16px 40px; }
      .hint { font-size: 14px; }
    }
    .skip-link { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; background: var(--lav); color: #000; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .skip-link:focus { top: 12px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
      .glow { animation: none !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#map">학습 가이드 지도로 건너뛰기</a>
  <div class="glow" aria-hidden="true"></div>
  <div class="wrap">
    <main>
      <h1 class="sr-only">코드 한 줄이 서비스가 되기까지</h1>
      <nav class="map" id="map" tabindex="-1" aria-label="학습 가이드 지도">
        <svg id="map-svg" focusable="false"></svg>
      </nav>
      <p class="hint" id="hint" aria-hidden="true"></p>
    </main>
  </div>
  <script>
  (function () {
    'use strict';
    var NS = 'http://www.w3.org/2000/svg';
    var G = [
      { id: 'gitflow', en: 'GIT FLOW', eb: '협업·버전 관리', ti: 'Git Flow 한눈에 보기', href: 'git_flow_commit_guideline/index.html', h: 340 },
      { id: 'cicd', en: 'CI/CD', eb: '지속적 통합·배포', ti: 'CI/CD 한눈에 보기', href: 'ci_cd_guideline/index.html', h: 158 },
      { id: 'docker', en: 'DOCKER', eb: '컨테이너 기초', ti: 'Docker 한눈에 보기', href: 'docker_guideline/index.html', h: 198, start: true },
      { id: 'terraform', en: 'TERRAFORM', eb: '인프라를 코드로', ti: 'Terraform 한눈에 보기', href: 'terraform_guideline/index.html', h: 268 },
      { id: 'k8s', en: 'KUBERNETES', eb: '컨테이너 오케스트레이션', ti: 'Kubernetes 한눈에 보기', href: 'k8s_guideline/index.html', h: 226 },
      { id: 'monitoring', en: 'MONITORING', eb: '관측·알림', ti: 'Monitoring 한눈에 보기', href: 'monitoring_guideline/index.html', h: 30 }
    ];
    var HINT0 = '탐색할 영역에 포인터를 올려보세요';

    // 판 윗면에 그리는 기호(윗면 좌표 ±44 안). 각 기술의 상표 대신 하는 일을 단순한 선으로 표시한다.
    var SYM = [
      // Git Flow: 두 갈래 브랜치와 커밋 점, 갈라지고 합쳐지는 선
      function (g) {
        p(g, 'M-28,-14 H28 M-28,14 H28 M-16,-14 L-4,14 M12,14 L20,-14');
        [[-16, -14], [20, -14], [-4, 14], [12, 14], [-26, 14]].forEach(function (c) { s('circle', { cx: c[0], cy: c[1], r: 4.2, 'class': 'dotf' }, g); });
      },
      // CI/CD: 계속 도는 고리(통합 → 배포 → 다시 통합)
      function (g) {
        p(g, 'M0,0 C-8,-16 -30,-16 -30,0 C-30,16 -8,16 0,0 C8,-16 30,-16 30,0 C30,16 8,16 0,0 Z');
        p(g, 'M20,-15 L27,-11 L21,-5');
      },
      // Docker: 차곡차곡 쌓인 컨테이너
      function (g) {
        [[-26, 2], [-8, 2], [10, 2], [-17, -14], [1, -14]].forEach(function (c) { s('rect', { x: c[0], y: c[1], width: 16, height: 13, rx: 2 }, g); });
        p(g, 'M-28,22 H28');
      },
      // Terraform: 중괄호 안의 코드 줄(구성 파일)
      function (g) {
        p(g, 'M-14,-24 C-24,-24 -18,-4 -28,0 C-18,4 -24,24 -14,24 M14,-24 C24,-24 18,-4 28,0 C18,4 24,24 14,24 M-8,-9 H9 M-8,0 H12 M-8,9 H4');
      },
      // Kubernetes: 가운데 제어부와 둘레의 노드들
      function (g) {
        var r = 24, i, a;
        for (i = 0; i < 6; i++) {
          a = Math.PI / 3 * i;
          p(g, 'M' + (Math.cos(a) * 8).toFixed(1) + ',' + (Math.sin(a) * 8).toFixed(1) + ' L' + (Math.cos(a) * (r - 5)).toFixed(1) + ',' + (Math.sin(a) * (r - 5)).toFixed(1));
          s('circle', { cx: (Math.cos(a) * r).toFixed(1), cy: (Math.sin(a) * r).toFixed(1), r: 4.6 }, g);
        }
        s('circle', { cx: 0, cy: 0, r: 7.5 }, g);
      },
      // Monitoring: 축과 시간에 따라 오르내리는 선
      function (g) {
        p(g, 'M-28,-26 V24 H28 M-20,12 L-8,-2 L2,6 L14,-16 L26,-6');
        s('circle', { cx: 14, cy: -16, r: 4, 'class': 'dotf' }, g);
      }
    ];

    function s(tag, a, par) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (par) par.appendChild(n); return n; }
    function p(g, d) { return s('path', { d: d }, g); }
    function iso(sx, sy, x, y, z) { return [sx + x - y, sy + (x + y) / 2 - (z || 0)]; }
    function pts(l) { return l.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '); }
    // 판 하나: 아래 두 옆면 + 윗면, 윗면 가운데 좌표를 돌려준다
    function slab(par, cx, cy, a, th) {
      var A = iso(cx, cy, -a, -a), B = iso(cx, cy, a, -a), C = iso(cx, cy, a, a), D = iso(cx, cy, -a, a);
      s('polygon', { 'class': 'fa', points: pts([D, C, [C[0], C[1] + th], [D[0], D[1] + th]]) }, par);
      s('polygon', { 'class': 'fb', points: pts([C, B, [B[0], B[1] + th], [C[0], C[1] + th]]) }, par);
      s('polygon', { 'class': 'ft', points: pts([A, B, C, D]) }, par);
    }
    function diamond(cx, cy, a) { return pts([iso(cx, cy, -a, -a), iso(cx, cy, a, -a), iso(cx, cy, a, a), iso(cx, cy, -a, a)]); }
    function text(par, cls, x, y, anchor, str) { var t = s('text', { 'class': cls, x: x, y: y, 'text-anchor': anchor }, par); t.textContent = str; return t; }

    var RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null, reduce = !!(RM && RM.matches);
    if (RM) { var onRM = function () { reduce = RM.matches; }; if (RM.addEventListener) RM.addEventListener('change', onRM); else if (RM.addListener) RM.addListener(onRM); }
    var NARROW = window.matchMedia ? window.matchMedia('(max-width: 720px)') : null;

    var svgEl = document.getElementById('map-svg'), map = document.getElementById('map'), hint = document.getElementById('hint');
    var tiles = [], P = [], cur = -1;

    // 넓은 화면: 01 → 06 을 왼쪽에서 오른쪽으로, 높낮이를 번갈아 띄운다(이름표는 높은 판은 위, 낮은 판은 아래)
    // 좁은 화면: 같은 순서를 위에서 아래로, 좌우를 번갈아 놓고 이름표는 반대쪽에 둔다
    function layout() {
      var narrow = !!(NARROW && NARROW.matches), L = [];
      G.forEach(function (g, i) {
        if (narrow) L.push({ cx: i % 2 ? 252 : 148, cy: 118 + i * 168, a: 40, th: 12, side: i % 2 ? 'left' : 'right' });
        else L.push({ cx: 128 + i * 189, cy: i % 2 ? 330 : 238, a: 46, th: 14, gy: (i % 2 ? 330 : 238) + 150, side: i % 2 ? 'below' : 'above' });
      });
      return { narrow: narrow, w: narrow ? 400 : 1200, h: narrow ? 1100 : 640, L: L };
    }

    function render() {
      var Y = layout(), ref = document.activeElement, refI = ref && ref.getAttribute ? ref.getAttribute('data-i') : null;
      svgEl.textContent = '';
      svgEl.setAttribute('viewBox', '0 0 ' + Y.w + ' ' + Y.h);
      tiles = []; P = [];
      var deco = s('g', { 'aria-hidden': 'true' }, svgEl);
      // 흐름 길: 넓은 화면은 바닥 그림자 가운데를, 좁은 화면은 판 가운데를 잇는다(판 뒤로 지나감)
      Y.L.forEach(function (o) { P.push(Y.narrow ? [o.cx, o.cy] : [o.cx, o.gy]); });
      s('polyline', { 'class': 'track', points: pts(P) }, deco);
      Y.L.forEach(function (o, i) {
        var g = G[i];
        var t = s('a', { 'class': 'tile', href: g.href, style: '--h:' + g.h, 'data-i': i, 'aria-label': '0' + (i + 1) + '. ' + g.ti + ' — ' + g.eb + (g.start ? ' (처음이라면 여기부터)' : '') }, svgEl);
        var a = o.a, half = a, top = o.cy - half;
        // 바닥 그림자와 판 모서리에서 내려오는 점선(넓은 화면)
        if (!Y.narrow) {
          s('polygon', { 'class': 'shadow', points: diamond(o.cx, o.gy, a) }, t);
          [[-a * 2, 0], [0, a], [a * 2, 0]].forEach(function (c) {
            s('line', { 'class': 'drop', x1: o.cx + c[0], y1: o.cy + c[1] + (c[1] ? o.th : o.th), x2: o.cx + c[0], y2: o.gy + c[1] }, t);
          });
        }
        var lift = s('g', { 'class': 'lift' }, t);
        slab(lift, o.cx, o.cy, a, o.th);
        var sym = s('g', { 'class': 'sym', transform: 'matrix(1 .5 -1 .5 ' + o.cx + ' ' + o.cy + ') scale(' + (a / 46).toFixed(3) + ')' }, lift);
        SYM[i](sym);
        // 이름표: 번호 · 영문 · 밑줄 · 한글 설명
        var lb = s('g', { 'aria-hidden': 'true' }, t), x, y, an, w = 0;
        if (Y.narrow) {
          an = o.side === 'right' ? 'start' : 'end';
          x = o.side === 'right' ? o.cx + a * 2 + 22 : o.cx - a * 2 - 22;
          y = o.cy - 18;
          text(lb, 'lbl-no', x, y - 26, an, '0' + (i + 1));
          var en = text(lb, 'lbl-en', x, y, an, g.en); en.style.fontSize = '16px';
          var ko = text(lb, 'lbl-ko', x, y + 46, an, g.eb); ko.style.fontSize = '14px';
          if (g.start) text(lb, 'lbl-start', x, y + 68, an, '처음이라면 여기부터');
          var ux = o.side === 'right' ? x - 14 : x + 14;
          s('path', { 'class': 'lbl-line', d: 'M' + ux + ',' + (y + 14) + ' H' + (o.side === 'right' ? x + 120 : x - 120) + ' M' + ux + ',' + (y + 14) + ' L' + (o.side === 'right' ? o.cx + a : o.cx - a) + ',' + (o.cy + a / 2) }, lb);
        } else if (o.side === 'above') {
          x = o.cx; y = top - 70;
          text(lb, 'lbl-no', x, y - 34, 'middle', '0' + (i + 1));
          text(lb, 'lbl-en', x, y, 'middle', g.en);
          text(lb, 'lbl-ko', x, y + 30, 'middle', g.eb);
          if (g.start) text(lb, 'lbl-start', x, y + 52, 'middle', '처음이라면 여기부터');
          s('path', { 'class': 'lbl-line', d: 'M' + (x - 80) + ',' + (y + 10) + ' H' + (x + 80) + ' M' + x + ',' + (y + (g.start ? 60 : 38)) + ' V' + (top - 10) }, lb);
        } else {
          x = o.cx; y = o.gy + a + 64;
          text(lb, 'lbl-no', x, y - 34, 'middle', '0' + (i + 1));
          text(lb, 'lbl-en', x, y, 'middle', g.en);
          text(lb, 'lbl-ko', x, y + 30, 'middle', g.eb);
          if (g.start) text(lb, 'lbl-start', x, y + 52, 'middle', '처음이라면 여기부터');
          s('path', { 'class': 'lbl-line', d: 'M' + (x - 80) + ',' + (y + 10) + ' H' + (x + 80) + ' M' + x + ',' + (o.gy + a + 6) + ' V' + (y - 52) }, lb);
        }
        t.addEventListener('click', function (e) {
          if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
          e.preventDefault(); go(i);
        });
        t.addEventListener('mouseenter', function () { on(i); });
        t.addEventListener('mouseleave', function () { on(-1); });
        t.addEventListener('focus', function () { on(i); });
        t.addEventListener('blur', function () { on(-1); });
        tiles.push(t);
      });
      if (refI !== null && tiles[+refI]) tiles[+refI].focus();
      on(cur);
    }

    function go(i) {
      if (reduce) { location.href = G[i].href; return; }
      on(i);
      document.documentElement.classList.add('is-leaving');
      setTimeout(function () { location.href = G[i].href; }, 340);
    }
    function on(i) {
      cur = i;
      tiles.forEach(function (t, k) { t.classList.toggle('is-on', k === i); });
      map.classList.toggle('has-on', i >= 0);
      if (i >= 0) {
        document.documentElement.style.setProperty('--h', G[i].h);
        hint.innerHTML = '';
        var b = document.createElement('b'); b.textContent = '0' + (i + 1) + ' ' + G[i].ti;
        hint.appendChild(b); hint.appendChild(document.createTextNode(' — 누르면 열립니다'));
      } else hint.textContent = HINT0;
    }
    window.addEventListener('pageshow', function () { document.documentElement.classList.remove('is-leaving'); on(-1); });
    if (NARROW) { if (NARROW.addEventListener) NARROW.addEventListener('change', render); else if (NARROW.addListener) NARROW.addListener(render); }
    render();
  })();
  </script>
</body>
</html>
